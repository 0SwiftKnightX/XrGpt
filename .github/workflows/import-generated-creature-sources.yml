name: Import generated creature source files

on:
  push:
    paths:
      - '.github/workflows/import-generated-creature-sources.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Download Blender sources
        env:
          GOBLIN: 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/e8c84219-651f-4cb5-bf22-1d5766e0d4be/revisions/00000001-create-goblin-001/scene.blend?X-Amz-Expires=900&X-Amz-Date=20260928T161823Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260928%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=4724e6a6ab0196d3cf74cf0cc783f518927ae0c954321479f866b2dc39daa7e4'
          ORC: 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/f1cbc93a-088d-4568-9cf0-848db6750f0a/revisions/00000001-create-orc-001/scene.blend?X-Amz-Expires=900&X-Amz-Date=20260928T161824Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260928%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=420e6fa17312dfee97bf84f6ab9cf5b0069c745bfce748200549ea3264bac3d8'
          TROLL: 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/03242cc9-2758-4971-a506-3d85e24884bc/revisions/00000001-create-troll-001/scene.blend?X-Amz-Expires=900&X-Amz-Date=20260928T161825Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260928%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=93bf5c98acf28dfa8a098c54f539b37c3c1084754de09648946e6e48cf133419'
        run: |
          curl --fail --location --retry 2 --output generated_visual_assets/enemies_monsters_creatures/goblin/goblin.blend "$GOBLIN"
          curl --fail --location --retry 2 --output generated_visual_assets/enemies_monsters_creatures/orc/orc.blend "$ORC"
          curl --fail --location --retry 2 --output generated_visual_assets/enemies_monsters_creatures/troll/troll.blend "$TROLL"
      - name: Commit source files
        run: |
          rm .github/workflows/import-generated-creature-sources.yml
          git config user.name 'XrGpt Creature Asset Pipeline'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated_visual_assets .github/workflows/import-generated-creature-sources.yml
          git commit -m 'Add editable Blender creature source files'
          git push
