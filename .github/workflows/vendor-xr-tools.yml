name: Vendor XR Tools

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone XR Tools fork
        run: git clone --depth 1 --branch master https://github.com/0SwiftKnightX/godot-xr-tools.git /tmp/godot-xr-tools

      - name: Vendor addon
        run: |
          rm -rf addons/godot-xr-tools
          mkdir -p addons
          cp -R /tmp/godot-xr-tools/addons/godot-xr-tools addons/godot-xr-tools
          cp /tmp/godot-xr-tools/LICENSE addons/godot-xr-tools/LICENSE

      - name: Commit vendor update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/godot-xr-tools
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vendor XR Tools fork into XrGpt [skip ci]"
          git push origin HEAD:main
