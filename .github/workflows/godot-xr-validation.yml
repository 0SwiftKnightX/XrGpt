name: Godot XR Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7
        run: |
          set -e
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -type f -name Godot -perm -111 | head -n 1)"
          test -n "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "$(dirname "$GODOT_BIN")" >> "$GITHUB_PATH"

      - name: Import and parse project
        run: godot --headless --path . --editor --quit

      - name: Run XR connection audit
        run: godot --headless --path . res://gameplay/validation/xrgpt_connection_audit_runner.tscn
