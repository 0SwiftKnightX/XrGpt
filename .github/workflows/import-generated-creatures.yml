name: Import generated creature assets

on:
  push:
    paths:
      - '.github/workflows/import-generated-creatures.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Create generated visual assets folders
        run: |
          mkdir -p generated_visual_assets/enemies_monsters_creatures/goblin
          mkdir -p generated_visual_assets/enemies_monsters_creatures/orc
          mkdir -p generated_visual_assets/enemies_monsters_creatures/troll
      - name: Download Goblin GLB
        env:
          URL: 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/e8c84219-651f-4cb5-bf22-1d5766e0d4be/revisions/00000001-create-goblin-001/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260928T161823Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260928%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=05e913351ecfb6a4158ceb2541e1fc35f472347678243ceedb08f6c4bd279bba'
        run: curl --fail --location --retry 2 --output generated_visual_assets/enemies_monsters_creatures/goblin/goblin.glb "$URL"
      - name: Download Orc GLB
        env:
          URL: 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/f1cbc93a-088d-4568-9cf0-848db6750f0a/revisions/00000001-create-orc-001/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260928T161823Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260928%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=fa52ad8593dd90eddd4085fa12d7b7e7a2c8643b956b6f9a84db7d94ca8e0108'
        run: curl --fail --location --retry 2 --output generated_visual_assets/enemies_monsters_creatures/orc/orc.glb "$URL"
      - name: Download Troll GLB
        env:
          URL: 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/03242cc9-2758-4971-a506-3d85e24884bc/revisions/00000001-create-troll-001/preview.glb?X-Amz-Expires=900&X-Amz-Date=20260928T161825Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20260928%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=cddb9ebe596546e525fdfd15a7898f0905d61381964babca05a5753b253f8971'
        run: curl --fail --location --retry 2 --output generated_visual_assets/enemies_monsters_creatures/troll/troll.glb "$URL"
      - name: Write asset manifests
        run: |
          cat > generated_visual_assets/enemies_monsters_creatures/goblin/asset.json <<'JSON'
          {"id":"creature.goblin.generated.001","name":"Goblin","format":"glb","units":"meters","origin":"feet","source":"Higgsfield 3D Jutsu procedural Blender scene","project_id":"e8c84219-651f-4cb5-bf22-1d5766e0d4be","revision":1,"status":"generated_procedural","runtime_target":"Godot 4.6.1 / Quest 3S"}
          JSON
          cat > generated_visual_assets/enemies_monsters_creatures/orc/asset.json <<'JSON'
          {"id":"creature.orc.generated.001","name":"Orc","format":"glb","units":"meters","origin":"feet","source":"Higgsfield 3D Jutsu procedural Blender scene","project_id":"f1cbc93a-088d-4568-9cf0-848db6750f0a","revision":1,"status":"generated_procedural","runtime_target":"Godot 4.6.1 / Quest 3S"}
          JSON
          cat > generated_visual_assets/enemies_monsters_creatures/troll/asset.json <<'JSON'
          {"id":"creature.troll.generated.001","name":"Troll","format":"glb","units":"meters","origin":"feet","source":"Higgsfield 3D Jutsu procedural Blender scene","project_id":"03242cc9-2758-4971-a506-3d85e24884bc","revision":1,"status":"generated_procedural","runtime_target":"Godot 4.6.1 / Quest 3S"}
          JSON
          cat > generated_visual_assets/enemies_monsters_creatures/README.md <<'MD'
          # Generated Visual Assets — Enemies / Monsters / Creatures

          This folder stores generated creature assets intended for the XrGpt game.

          - `goblin/` — generated Goblin GLB + manifest
          - `orc/` — generated Orc GLB + manifest
          - `troll/` — generated Troll GLB + manifest

          The current meshes are procedural low-poly blockouts, not final production-quality character meshes. They are authored at metre scale with the origin at the feet and exported as GLB for Godot intake. Runtime/Quest validation remains a separate gate.
          MD
      - name: Append XrGpt README work log
        run: |
          cat >> README.md <<'MD'

          - 2026-09-28T16:00:00Z — GPT Creature Asset Pipeline / Generated Visual Assets: created the `generated_visual_assets/enemies_monsters_creatures/` asset family and added procedural GLB blockouts for Goblin, Orc, and Troll. Assets are authored at metre scale with feet-origin conventions and packaged with per-asset manifests for Godot intake. These are generated visual assets/blockouts; production animation, gameplay integration, and physical Quest 3S validation remain separate gates. — GPT Creature Asset Pipeline
          MD
      - name: Remove temporary importer workflow and commit assets
        run: |
          rm .github/workflows/import-generated-creatures.yml
          git config user.name 'XrGpt Creature Asset Pipeline'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated_visual_assets README.md .github/workflows/import-generated-creatures.yml
          git commit -m 'Add generated goblin orc and troll visual assets'
          git push
